name: Build and Publish to gh-pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout publication renderer
        uses: actions/checkout@v4
        with:
          repository: Axym-Labs/harness-execution
          ref: 121e24d71df2c515d60bcd9bce4e9d9127f94adf
          path: .publication-tools

      - name: Install LaTeX-to-HTML dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-urw-base35 texlive-extra-utils texlive-fonts-recommended texlive-latex-extra

      - name: Render embedded LaTeX articles
        run: |
          python .publication-tools/skills/publish-work/scripts/render-latex-publications.py \
            --source-dir content/latex/posts \
            --output-dir _posts \
            --site-root . \
            --css-output assets/css/latex-publication.css \
            --metadata-field latex_publication=true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

name: Build and Publish to gh-pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Pick up changes to the axym.org work list.
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout publication renderer
        uses: actions/checkout@v4
        with:
          repository: Axym-Labs/harness-execution
          ref: e2b25f853a846c641f33e61a2a9f3a6f017e8b7c
          path: .publication-tools

      - name: Install LaTeX-to-HTML dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-urw-base35 texlive-extra-utils texlive-fonts-recommended texlive-latex-extra

      - name: Render embedded LaTeX articles
        run: |
          python .publication-tools/skills/publish-work/scripts/render-latex-publications.py \
            --source-dir content/latex/posts \
            --output-dir _posts \
            --site-root . \
            --css-output assets/css/latex-publication.css \
            --metadata-field latex_publication=true

      - name: Fetch work list from axym.org
        # Falls back to the committed snapshot if the endpoint is unavailable.
        run: |
          curl -fsSL --retry 3 https://axym.org/api/work.json -o /tmp/axym_work.json \
            && python3 -c "import json; assert json.load(open('/tmp/axym_work.json'))['items']" \
            && mv /tmp/axym_work.json _data/axym_work.json \
            || echo "Using committed _data/axym_work.json"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify canonical indexing routes
        run: tests/test-indexing.sh _site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
